[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalts"
version = "0.27.0"
description = "Causal Discovery for Time Series"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
  { name = "Mohammad Fesanghary" },
  { name = "Achintya Gopal" },
  { name = "Agathe Sadeghi" },
]
keywords = [
  "causal-discovery",
  "time-series",
  "nonstationary",
  "causal-inference",
  "conditional-independence",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "torch>=2.0",
  "scipy>=1.10",
  "networkx>=3.0",
  "causal-learn>=0.1.3",
  "dcor>=0.6",
  "tqdm>=4.60",
  "scikit-learn>=1.2",
  "statsmodels>=0.14",
  "numba>=0.57",
  "matplotlib>=3.7",
  "pytorch-lightning>=2.0",
  "click>=8.0",
]

[project.scripts]
causal-ts = "causalts.cli:main"

[project.urls]
Homepage = "https://github.com/bloomberg/causal-ts"
Repository = "https://github.com/bloomberg/causal-ts"
Issues = "https://github.com/bloomberg/causal-ts/issues"
Changelog = "https://github.com/bloomberg/causal-ts/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dowhy = ["dowhy>=0.11"]
tigramite = ["tigramite"]
parquet = ["pyarrow>=10.0"]
dev = [
  "pytest>=7.0",
  "black>=23.0",
  "isort>=5.12",
  "flake8>=6.0",
  "ipykernel>=6.0",
  "jupytext==1.19.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["causalts*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# Ship only the functional skill files in the wheel. Design rationale lives in
# docs/skills/ (out of the skill dir) so it ships with neither the wheel nor the
# plugin git-copy.
causalts = ["py.typed", "skills/*/SKILL.md", "skills/*/agents/*"]

[tool.black]
line-length = 88
target-version = ['py312']
# Jupytext mirrors of example notebooks (examples/scripts/*.py) mirror the
# notebook source verbatim; the notebooks themselves are lint-exempt (see
# lint.yml).
extend-exclude = "examples/scripts/"

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["examples/*"]

[tool.flake8]
max-line-length = 88
# E203, E226, W503 conflict with black's formatting; E501 is enforced by black.
extend-ignore = ["E203", "E226", "E501", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "docs",
  "experiments",
  ".venv",
  "venv",
]
# __init__.py modules re-export names to form the public API.
# examples/scripts/*.py are Jupytext mirrors of the example notebooks, which
# are lint-exempt (see lint.yml): skip style codes and notebook idioms (unused
# imports, re-imports across cells, trailing ';'). Syntax errors (E9) and
# undefined names (F821-F823) still run, so a corrupted pair fails CI.
per-file-ignores = [
  "__init__.py:F401",
  "examples/scripts/*.py:E1,E2,E3,E4,E5,E7,W,F401,F541,F811,F824,F841",
]

# Pair every example notebook with a py:percent mirror in examples/scripts/
# so notebook changes are reviewable as plain-text diffs. Scoped to examples/
# so tutorial.ipynb and package notebooks stay unpaired. Outputs and widget
# state live only in the .ipynb. See CONTRIBUTING.md.
[tool.jupytext]
formats = "examples///ipynb,examples/scripts///py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
