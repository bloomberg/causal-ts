[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalts"
version = "0.25.1"
description = "Causal Discovery for Time Series"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
  { name = "Mohammad Fesanghary" },
  { name = "Achintya Gopal" },
  { name = "Agathe Sadeghi" },
]
keywords = [
  "causal-discovery",
  "time-series",
  "nonstationary",
  "causal-inference",
  "conditional-independence",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "torch>=2.0",
  "scipy>=1.10",
  "networkx>=3.0",
  "causal-learn>=0.1.3",
  "dcor>=0.6",
  "tqdm>=4.60",
  "scikit-learn>=1.2",
  "statsmodels>=0.14",
  "numba>=0.57",
  "matplotlib>=3.7",
  "pytorch-lightning>=2.0",
  "click>=8.0",
]

[project.scripts]
causal-ts = "causalts.cli:main"

[project.urls]
Homepage = "https://github.com/bloomberg/causal-ts"
Repository = "https://github.com/bloomberg/causal-ts"
Issues = "https://github.com/bloomberg/causal-ts/issues"
Changelog = "https://github.com/bloomberg/causal-ts/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dowhy = ["dowhy>=0.11"]
tigramite = ["tigramite"]
dev = [
  "pytest>=7.0",
  "black>=23.0",
  "isort>=5.12",
  "flake8>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["causalts*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
causalts = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
# E203, E226, W503 conflict with black's formatting; E501 is enforced by black.
extend-ignore = ["E203", "E226", "E501", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "docs",
  "experiments",
  ".venv",
  "venv",
]
# __init__.py modules re-export names to form the public API.
per-file-ignores = ["__init__.py:F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
