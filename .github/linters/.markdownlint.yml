---
# Default state for all rules
default: true
# Path to configuration file to extend
extends: null

# MD013/line-length — disabled: generated hero/gallery HTML in docs/ (badges,
# data-tooltip attributes) routinely runs 200-400 chars on a single line.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md013.md
MD013: false

# MD033/no-inline-html — Sphinx/MyST docs (docs/index.md, README.md) rely on
# raw HTML for hero sections, badges, and collapsible <details> blocks.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md033.md
MD033: false

# MD031/blanks-around-fences — MyST admonition/grid directives commonly omit
# blank lines around fenced code blocks.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md031.md
MD031: false

# MD041/first-line-heading/first-line-h1 — Sphinx pages often start with a
# {toctree} directive or html_meta front matter instead of an H1.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md041.md
MD041: false

# MD036/no-emphasis-as-heading — docs/algorithms.md uses bold run-in labels
# (e.g. "**CDNOTS**") by design, not as a heading substitute.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md036.md
MD036: false

# MD022/blanks-around-headings, MD032/blanks-around-lists — docs/ci_tests.md
# uses a dense heading+list format without blank-line padding by design.
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md022.md
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md032.md
MD022: false
MD032: false

# MD012/no-multiple-blanks
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md012.md
MD012: false

# MD060/table-column-style — disabled: the docs use compact tables
# (`|---|---|`) whose pipes are not padded or column-aligned. The rule wants one
# consistent style repo-wide, and the existing tables predate it — docs/cli.md
# alone trips it 59 times untouched. Since super-linter only lints changed
# files, leaving it on means any PR that edits a page inherits an unrelated
# table-reformatting diff.
# https://github.com/DavidAnson/markdownlint/blob/main/doc/md060.md
MD060: false

# MD024/no-duplicate-heading
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md024.md
MD024:
  # Only check sibling headings
  siblings_only: true

# MD025/single-title/single-h1
# https://github.com/DavidAnson/markdownlint/blob/v0.34.0/doc/md025.md
MD025:
  # RegExp for matching title in front matter
  front_matter_title: ""
