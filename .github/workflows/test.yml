---
name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The full extras matrix runs on Ubuntu (the default `os`, left out so the
        # existing check names stay unchanged); macOS and Windows run the core tests.
        include:
          - python-version: "3.10"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.11"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.12"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.13"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.14"
            install-target: ".[dev]"
            profile: core
          - python-version: "3.12"
            os: macos-latest
            install-target: ".[dev]"
            profile: core
          - python-version: "3.12"
            os: windows-latest
            install-target: ".[dev]"
            profile: core
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit

      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install-target }}"

      - name: run tests
        if: ${{ !(matrix.python-version == '3.12' && matrix.profile == 'all-extras') }}
        run: python -m pytest tests/ -v --tb=short

      - name: run tests with coverage
        if: ${{ matrix.python-version == '3.12' && matrix.profile == 'all-extras' }}
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=causalts --cov-branch --cov-report=term-missing:skip-covered
          {
            echo "## Test coverage (line + branch, causalts/)"
            python -m coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
