---
name: scorecard

on:
  push:
    branches:
      # Run on pushes to default branch
      - main
  schedule:
    # Run weekly on Saturdays
    - cron: "30 1 * * 6"
  # Run when branch protection rules change
  branch_protection_rule:
  # Run the workflow manually
  workflow_dispatch:

# Declare default permissions as read-only
permissions: read-all

jobs:
  run-scorecard:
    # Call reusable workflow file
    uses: bloomberg/.github/.github/workflows/_scorecard.yml@6e6478c5f719f8ac2251558635f700dd5c0f128e # main
    permissions:
      id-token: write
      security-events: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
    with:
      # Publish results of Scorecard analysis
      publish-results: true
