---
name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: read-all

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test Python ${{ matrix.python-version }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.11"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.12"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.13"
            install-target: ".[dev,dowhy,tigramite]"
            profile: all-extras
          - python-version: "3.14"
            install-target: ".[dev]"
            profile: core
    steps:
      - name: harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install-target }}"

      - name: run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]

          release_tag = os.environ["RELEASE_TAG"]
          tag_version = release_tag.removeprefix("v")
          if tag_version != package_version:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match "
                  f"pyproject.toml version {package_version!r}."
              )
          print(f"Building causalts {package_version}")
          PY

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke-test-wheel:
    name: smoke test wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: install and import wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          from importlib.metadata import version

          import causalts

          print(f"causalts {version('causalts')} imported from {causalts.__file__}")
          PY
          causal-ts --help

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: smoke-test-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/causalts
    permissions:
      id-token: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
