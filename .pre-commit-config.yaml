---
# Optional local hooks: `pip install pre-commit && pre-commit install`.
# CI (lint.yml, python-lint job) runs the same jupytext check, so skipping
# the hook only means finding out later.
repos:
  - repo: https://github.com/mwouts/jupytext
    rev: 9fccc3d85485e01264eb3454fae8c5ab4d093cfb  # frozen: v1.19.6
    hooks:
      # Keep examples/*.ipynb and their examples/scripts/*.py mirrors in
      # sync (pairing is configured in [tool.jupytext] in pyproject.toml).
      - id: jupytext
        args: [--sync]
        files: ^examples/(scripts/)?[^/]+\.(ipynb|py)$
